[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyradtool"
version = "1.1.2"
description = "Analog Devices EV-TINYRAD24G 24GHz Radar Evaluation GUI (macOS, Linux, Windows)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "PyQt5>=5.15.7",
    "pyqtgraph>=0.13.1",
    "pyusb>=1.2.1",
    "h5py>=3.8.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
